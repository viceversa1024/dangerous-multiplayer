<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dangerous Writing — Multiplayer</title>
<meta name="description" content="Multiplayer dangerous writing. If anyone in the room stops typing for 5 seconds, everyone loses their progress." />
<meta name="theme-color" content="#ef4444" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Dangerous Writing — Multiplayer" />
<meta property="og:title" content="⚠️ Dangerous Writing — Multiplayer" />
<meta property="og:description" content="Stop typing for 5 seconds and EVERYONE loses their progress. Host a room, share a 4-letter code, write together until someone chokes." />
<meta property="og:url" content="https://dangerous-multiplayer.fly.dev/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="⚠️ Dangerous Writing — Multiplayer" />
<meta name="twitter:description" content="Stop typing for 5 seconds and EVERYONE loses their progress." />
<style>
  :root {
    --bg: #181d20;
    --fg: #f4f4f5;
    --muted: #71717a;
    --accent: #ef4444;
    --accent-2: #fbbf24;
    --good: #22c55e;
    --panel: #18181b;
    --border: #27272a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .warning-banner {
    background: linear-gradient(180deg, rgba(239,68,68,0.18), rgba(239,68,68,0.08));
    border-bottom: 2px solid var(--accent);
    padding: 28px 24px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.01em;
  }
  .warning-banner .seconds { color: var(--accent); font-size: 28px; font-weight: 800; }
  .warning-banner .wipe { color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
  @media (max-width: 540px) {
    .warning-banner { font-size: 17px; padding: 20px 16px; }
    .warning-banner .seconds { font-size: 22px; }
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px; width: 100%; max-width: 480px; }
  h2 { margin-top: 0; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  input, button {
    font: inherit;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #181d20;
    color: var(--fg);
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent-2); }
  button {
    cursor: pointer;
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
    transition: transform 0.05s ease;
  }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .stack > * + * { margin-top: 14px; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 24px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .err { color: var(--accent); font-size: 14px; min-height: 1.2em; }
  .hint { color: var(--muted); font-size: 13px; }
  footer { padding: 14px 24px; text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>⚠️ Dangerous Writing — Multiplayer</h1>
</header>
<div class="warning-banner">
  If <u>anyone</u> stops typing for <span class="seconds">5 seconds</span>,<br />
  <span class="wipe">everyone loses their progress.</span>
</div>
<main>
  <div class="card stack">
    <h2>Join a room</h2>
    <div class="stack">
      <input id="code" placeholder="ROOM CODE" maxlength="4" autocapitalize="characters" autocomplete="off" style="text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-size: 22px;" />
      <input id="name" placeholder="Your name" maxlength="20" autocomplete="off" />
      <button id="join">Join</button>
      <div class="err" id="err"></div>
    </div>
    <div class="divider">or</div>
    <button id="host" class="secondary">Host a new room</button>
    <div class="hint">Hosting opens a display screen with a room code players can join from any device.</div>
  </div>
</main>
<script>
  const code = document.getElementById('code');
  const name = document.getElementById('name');
  const err = document.getElementById('err');
  document.getElementById('join').onclick = () => {
    const c = code.value.trim().toUpperCase();
    const n = name.value.trim();
    if (c.length !== 4) { err.textContent = 'Enter a 4-letter room code.'; return; }
    if (!n) { err.textContent = 'Enter your name.'; return; }
    location.href = `/play.html?code=${encodeURIComponent(c)}&name=${encodeURIComponent(n)}`;
  };
  document.getElementById('host').onclick = () => { location.href = '/host.html'; };
  code.addEventListener('input', () => { code.value = code.value.toUpperCase(); });
</script>
</body>
</html>
